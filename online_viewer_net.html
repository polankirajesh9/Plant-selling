
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GreenLeaf - Plant Store</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f8f0;
      color: #243b29;
    }

    header {
      background: #174d2b;
      color: white;
      padding: 20px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    header h1 {
      font-size: 28px;
    }

    header span {
      color: #b7e89b;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 18px;
    }

    .hero {
      min-height: 350px;
      padding: 70px 8%;
      background: linear-gradient(90deg,
        rgba(15, 55, 28, 0.9), rgba(15, 55, 28, 0.25)),
        url("https://images.unsplash.com/photo-1416879595882-3373a0480b5b?auto=format&fit=crop&w=1600&q=80")
        center/cover;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      gap: 18px;
    }

    .hero h2 {
      font-size: clamp(32px, 5vw, 48px);
      max-width: 550px;
    }

    .hero p {
      font-size: 18px;
    }

    .hero a {
      background: #b7e89b;
      color: #174d2b;
      padding: 13px 22px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
    }

    .section {
      padding: 45px 8%;
    }

    .section h2 {
      text-align: center;
      margin-bottom: 12px;
    }

    .subtitle {
      text-align: center;
      color: #657367;
      margin-bottom: 25px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 24px;
    }

    .card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px #00000012;
      transition: transform 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card img {
      width: 100%;
      height: 210px;
      object-fit: cover;
    }

    .details {
      padding: 18px;
    }

    .details h3 {
      margin-bottom: 8px;
    }

    .price {
      color: #218044;
      font-size: 20px;
      font-weight: bold;
      margin: 12px 0;
    }

    button {
      background: #23753c;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 11px 15px;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      background: #174d2b;
    }

    .cart {
      background: #e7efdf;
      border-radius: 12px;
      padding: 24px;
      margin-top: 35px;
    }

    .cart h3 {
      margin-bottom: 15px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #cbd8c6;
    }

    .remove {
      background: #a83a31;
      padding: 7px 10px;
    }

    .total {
      font-size: 21px;
      font-weight: bold;
      margin: 18px 0;
    }

    footer {
      text-align: center;
      background: #174d2b;
      color: white;
      padding: 25px;
      margin-top: 30px;
    }

    @media (max-width: 500px) {
      header {
        padding: 18px 5%;
      }

      nav a {
        margin-left: 0;
        margin-right: 12px;
      }

      .section {
        padding: 35px 5%;
      }

      .hero {
        padding: 50px 6%;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>🌿 Green<span>Leaf</span></h1>
    <nav>
      <a href="#home">Home</a>
      <a href="#plants">Plants</a>
      <a href="#cart">Cart (<span id="cart-count">0</span>)</a>
    </nav>
  </header>

  <section class="hero" id="home">
    <h2>Bring Nature Into Your Home</h2>
    <p>Discover beautiful plants and grow a greener life.</p>
    <a href="#plants">Shop Plants</a>
  </section>

  <section class="section" id="plants">
    <h2>Our Plants 🌱</h2>
    <p class="subtitle">Find the perfect plant for your space.</p>
    <div class="products" id="products"></div>

    <div class="cart" id="cart">
      <h3>🛒 Your Shopping Cart</h3>
      <div id="cart-items">Your cart is empty.</div>
      <p class="total">Total: ₹<span id="total">0</span></p>
      <button onclick="checkout()">Place Order</button>
      <p id="message" style="margin-top: 12px;"></p>
    </div>
  </section>

  <footer>
    <p>© 2026 GreenLeaf Plant Store</p>
    <p>Grow Green, Live Clean 🌿</p>
  </footer>

  <script>
    const plants = [
      {
        id: 1,
        name: "Money Plant",
        price: 149,
        image: "photo-1501004318641-b39e6451bec6"
      },
      {
        id: 2,
        name: "Snake Plant",
        price: 299,
        image: "photo-1509423350716-97f9360b4e09"
      },
      {
        id: 3,
        name: "Peace Lily",
        price: 249,
        image: "photo-1459156212016-c812468e2115"
      },
      {
        id: 4,
        name: "Aloe Vera",
        price: 99,
        image: "photo-1509423350716-97f9360b4e09"
      }
    ];

    let cart = [];

    const productsElement = document.getElementById("products");

    plants.forEach(plant => {
      productsElement.innerHTML += `
        <div class="card">
          <img
            src="https://images.unsplash.com/${plant.image}?auto=format&fit=crop&w=600&q=80"
            alt="${plant.name}"
            loading="lazy"
          >
          <div class="details">
            <h3>${plant.name}</h3>
            <p>Fresh and healthy plant for your home.</p>
            <p class="price">₹${plant.price}</p>
            <button onclick="addToCart(${plant.id})">
              Add to Cart
            </button>
          </div>
        </div>
      `;
    });

    function addToCart(id) {
      const plant = plants.find(p => p.id === id);
      const item = cart.find(p => p.id === id);

      if (item) {
        item.quantity++;
      } else {
        cart.push({ ...plant, quantity: 1 });
      }

      renderCart();
    }

    function removeFromCart(id) {
      cart = cart.filter(p => p.id !== id);
      renderCart();
    }

    function renderCart() {
      const cartItems = document.getElementById("cart-items");
      const count = cart.reduce((sum, p) => sum + p.quantity, 0);
      const total = cart.reduce(
        (sum, p) => sum + p.price * p.quantity, 0
      );

      document.getElementById("cart-count").textContent = count;
      document.getElementById("total").textContent = total;
      document.getElementById("message").textContent = "";

      if (cart.length === 0) {
        cartItems.textContent = "Your cart is empty.";
        return;
      }

      cartItems.innerHTML = cart.map(p => `
        <div class="cart-item">
          <span>${p.name} × ${p.quantity}</span>
          <span>₹${p.price * p.quantity}</span>
          <button class="remove" onclick="removeFromCart(${p.id})">
            Remove
          </button>
        </div>
      `).join("");
    }

    function checkout() {
      if (cart.length === 0) {
        document.getElementById("message").textContent =
          "Please add a plant to your cart first.";
        return;
      }

      const order = cart.map(p =>
        `${p.name} x ${p.quantity} = ₹${p.price * p.quantity}`
      ).join("\n");

      const total = cart.reduce(
        (sum, p) => sum + p.price * p.quantity, 0
      );

      document.getElementById("message").textContent =
        "Demo only: your order has not been submitted. " +
        "Total: ₹" + total + ". Connect a backend to accept real orders.";

      alert("Your selected plants:\n" + order +
            "\n\nTotal: ₹" + total +
            "\n\nThis is a demo. No order has been placed.");
    }
  </script>

</body>
</html>
